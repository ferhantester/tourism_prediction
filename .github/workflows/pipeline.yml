
name: Tourism Prediction MLOps Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==================================================
  # JOB 1: REGISTER DATASET
  # ==================================================

  register-dataset:

    name: Register Dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Register Dataset
        run: |
          echo "Registering tourism dataset..."
          test -f data/tourism.csv
          echo "Dataset found successfully."
          echo "Dataset registered for the pipeline."

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-dataset
          path: data/tourism.csv


  # ==================================================
  # JOB 2: DATA PREPARATION
  # ==================================================

  data-preparation:

    name: Data Preparation

    needs: register-dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-dataset
          path: data/

      - name: Validate dataset
        run: |
          python validate_data.py

      - name: Prepare data
        run: |
          python model_building/prepare_data.py

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: artifacts/


  # ==================================================
  # JOB 3: MODEL TRAINING
  # ==================================================

  model-training:

    name: Model Training

    needs: data-preparation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: artifacts/

      - name: Start MLflow tracking
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &
          sleep 5

      - name: Train models
        run: |
          python model_building/train.py

      - name: Check trained model
        run: |
          test -f deployment/best_model.joblib
          echo "Best model created successfully."

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deployment/best_model.joblib

          git commit -m "Update trained tourism model [skip ci]" || echo "No changes to commit"

          git push
